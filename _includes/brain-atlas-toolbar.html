{% if include.species == 'rat' %}
  {% assign atlas_regions = site.data.rat_atlas_regions %}
{% else %}
  {% assign atlas_regions = site.data.mouse_atlas_regions %}
{% endif %}

<div class="atlas-toolbar">
  <div class="atlas-toolbar__presets">
    <label class="atlas-region-pick__label atlas-sr-only" for="atlas-region-select">Structure preset</label>
    <div class="atlas-region-pick__control">
      <select id="atlas-region-select" class="atlas-region-pick__select" autocomplete="off">
        {% for r in atlas_regions %}
        {% if r.ap == nil and r.ml == nil and r.dv == nil %}
        <option value="">{{ r.label }}</option>
        {% else %}
        <option
          value="p{{ forloop.index }}"
          data-ap="{{ r.ap }}"
          data-ml="{{ r.ml }}"
          data-dv="{{ r.dv }}"
          {% if r.notes %}title="{{ r.notes | xml_escape }}"{% endif %}
        >{{ r.label }}</option>
        {% endif %}
        {% endfor %}
      </select>
    </div>
  </div>

  {% if include.species == 'rat' %}
  <div class="atlas-marker-tools" role="group" aria-label="Marker style">
    <div class="atlas-marker-mode" role="radiogroup" aria-label="Crosshair or line">
      <label class="atlas-marker-mode__option">
        <input type="radio" name="atlas-marker-mode" value="crosshair" checked>
        <span>Crosshair</span>
      </label>
      <label class="atlas-marker-mode__option">
        <input type="radio" name="atlas-marker-mode" value="line">
        <span>Line</span>
      </label>
    </div>
    <div class="atlas-marker-tools__crosshair-only">
      <div class="atlas-marker-tools__control">
        <label class="atlas-marker-tools__mini-label" for="atlas-crosshair-scale">Size</label>
        <input type="range" id="atlas-crosshair-scale" class="atlas-marker-tools__range" min="0.65" max="1.45" step="0.05" value="1" aria-label="Crosshair size">
      </div>
    </div>
    <div class="atlas-marker-tools__line-only" hidden>
      <div class="atlas-marker-tools__control">
        <label class="atlas-marker-tools__mini-label" for="atlas-entry-angle">Angle</label>
        <input type="range" id="atlas-entry-angle" class="atlas-marker-tools__range atlas-marker-tools__range--wide" min="-45" max="45" step="1" value="0" aria-label="Entry angle from vertical in degrees, positive lateral">
        <span class="atlas-marker-tools__angle-value" id="atlas-entry-angle-value" aria-hidden="true">0°</span>
      </div>
      <p class="atlas-marker-tools__line-readout" id="atlas-line-readout" aria-live="polite">0° · Entry ML at DV=0: — mm</p>
    </div>
  </div>
  {% else %}
  <div class="atlas-crosshair" role="group" aria-labelledby="atlas-crosshair-legend">
    <span id="atlas-crosshair-legend" class="atlas-crosshair__legend">Crosshair</span>
    <div class="atlas-crosshair__control">
      <label class="atlas-crosshair__mini-label" for="atlas-crosshair-scale">Size</label>
      <input type="range" id="atlas-crosshair-scale" class="atlas-crosshair__range" min="0.65" max="1.45" step="0.05" value="1" aria-label="Crosshair size">
    </div>
  </div>
  {% endif %}
</div>
